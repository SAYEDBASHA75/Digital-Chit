name: Digital-Chit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Selenium suite
        run: |
          rm -rf e2e/specs e2e/report/*.xlsx
          node e2e/createTestSpec.js "Selenium Website"
          node e2e/generateTests.js
          npx mocha "e2e/specs/TC*.cjs" --timeout 60000 --reporter json --reporter-options output=./e2e/report/results.json || true
          node e2e/report/generateReport.js "Selenium_Website_Test_Report"
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: e2e/report/Selenium_Website_Test_Report_*.xlsx

  appium-tests:
    name: "📱 Appium — Android Tests (300)"
