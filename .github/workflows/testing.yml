name: Digital‑Chit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:selenium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: e2e/report/*.xlsx

  appium-tests:
    name: "📱 Appium — Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:appium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: e2e/report/*.xlsx

  unit-tests:
    name: "🧪 Unit Tests — API (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: |
          rm -f e2e/specs/mergedTests.*
          npm run test:unit
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: e2e/report/*.xlsx

  validation-tests:
    name: "✅ Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:validation
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: e2e/report/*.xlsx

  deployment-status:
    name: "🚀 Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:api
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: e2e/report/*.xlsx

  load-testing:
    name: "📊 Load Testing — Performance (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:load
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: e2e/report/*.xlsx

  compile-master-report:
    name: "📑 Compile Master Report & Deploy"
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: e2e/report/*.xlsx

